[package]
name = "tore-core"
version = "0.7.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "Töre'nin deterministik yayın, takip ve kullanıcı yazımı karşılaştırma doğrulamaları"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
wasm-bindgen = "=0.2.105"
url = "=2.5.7"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
